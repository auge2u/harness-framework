[tox]
envlist = py310,py311,py312,py313,lint,type-check

[testenv]
deps = 
    pytest
    pytest-asyncio
    pytest-cov
commands =
    PYTHONPATH=src pytest tests/ -v --tb=short

[testenv:lint]
deps =
    black
    ruff
commands =
    black --check src tests
    ruff check src tests

[testenv:type-check]
deps =
    mypy
    types-PyYAML
commands =
    mypy src/harness

[testenv:coverage]
deps =
    pytest
    pytest-cov
commands =
    PYTHONPATH=src pytest tests/ --cov=harness --cov-report=term-missing --cov-report=html
